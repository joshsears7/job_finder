target-version = "py311"
line-length = 100
exclude = ["backups", "__pycache__", ".venv", "chroma_db"]

[lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "PIE", "SIM"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E402",   # module-level import order — dotenv must load before app modules
    "E701",   # multiple statements on one colon line — intentional for Streamlit brevity
    "E702",   # multiple statements on one semicolon line — intentional
    "E741",   # ambiguous variable name — `l` in list comprehensions
    "B008",
    "B905",
    "SIM108",
    "SIM102", # nested if — intentional for readability in long Streamlit pages
    "SIM105", # contextlib.suppress — try/except is clearer when paired with logging
]

[format]
quote-style = "double"
indent-style = "space"
